version: '3.8'

services:
  neo4j-db:
    image: neo4j:4.4-enterprise
    container_name: pcm_neo4j_backend
    environment:
      - NEO4J_AUTH=neo4j/secure_pcm_password_2026
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./data:/var/lib/neo4j/import
    networks:
      - pcm_net

  pcm-ingestor:
    build: .
    container_name: pcm_ingestion_engine
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=your-password
    depends_on:
      - neo4j-db
    networks:
      - pcm_net

volumes:
  neo4j_data:

networks:
  pcm_net:
    driver: bridge
